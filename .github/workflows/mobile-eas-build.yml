name: Mobile EAS Build (Android + iOS)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mobile-eas-build.yml"
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: mobile-eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configure-eas-environments:
    name: Configure shared web API URL in EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.3.0"

      - name: Install mobile dependencies
        run: npm ci

      - name: Set shared web API URL for preview and production builds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository secret EXPO_TOKEN is missing."
            exit 1
          fi
          npx --yes eas-cli@latest env:set --environment preview --name EXPO_PUBLIC_WEB_URL --value https://a-little-world-with-us.vercel.app --visibility plaintext --non-interactive --json
          npx --yes eas-cli@latest env:set --environment production --name EXPO_PUBLIC_WEB_URL --value https://a-little-world-with-us.vercel.app --visibility plaintext --non-interactive --json

  eas-build:
    needs: configure-eas-environments
    name: EAS build — ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.3.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Check Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository secret EXPO_TOKEN is missing. Add an Expo access token in GitHub Actions secrets, then rerun this workflow."
            exit 1
          fi

      - name: Install mobile dependencies
        run: npm ci

      - name: Validate EAS build profiles
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
          if (eas.build?.development?.ios?.simulator !== true) {
            throw new Error("The iOS CI build must use a simulator-enabled development profile.");
          }
          if (eas.build?.preview?.android?.buildType !== "apk") {
            throw new Error("The Android CI preview profile must produce an APK.");
          }
          console.log("EAS iOS simulator and Android APK profiles are configured.");
          NODE

      - name: Build ${{ matrix.platform }} with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            npx --yes eas-cli@latest build --platform ios --profile development --non-interactive
          else
            npx --yes eas-cli@latest build --platform android --profile preview --clear-cache --non-interactive
          fi
