<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="lwBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="lwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Tile -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#180b1e" stroke="url(#lwBorderGrad)" stroke-width="3.5" />

  <!-- Inner Ambient Rose Fill -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="rgba(244, 63, 94, 0.05)" />

  <!-- Exact Scaled Intertwined Twin Hearts Glyph -->
  <g transform="translate(18, 18) scale(2.666)" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#lwGlow)">
    <!-- Primary Heart (Rose Pink) -->
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
          stroke="#f43f5e" stroke-width="1.8" />
    <!-- Secondary Small Heart (Sunset Gold Glow) -->
    <path d="M 12 7 C 10.5 5.5, 8.5 6, 8 7.5 C 7.5 9, 12 13, 12 13 C 12 13, 16.5 9, 16 7.5 C 15.5 6, 13.5 5.5, 12 7 Z"
          stroke="#fde047" stroke-width="1.4" fill="rgba(253, 224, 71, 0.15)" />
  </g>
</svg>