name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      
      - name: Install web dependencies
        working-directory: ./apps/web
        run: npm ci --ignore-scripts
      
      - name: Warn when E2E secrets are missing
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL == '' || env.NEXT_PUBLIC_SUPABASE_ANON_KEY == '' }}
        run: echo "::warning::Skipping Playwright tests because Supabase E2E secrets are not configured."

      - name: Install Playwright browsers
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' && env.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' }}
        working-directory: ./apps/web
        run: ./node_modules/.bin/playwright install --with-deps
      
      - name: Run Playwright tests
        if: ${{ env.NEXT_PUBLIC_SUPABASE_URL != '' && env.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' }}
        id: playwright
        working-directory: ./apps/web
        run: npm run test:e2e
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Report E2E outcome
        if: always()
        env:
          E2E_SECRETS_AVAILABLE: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
        run: |
          if [ "$E2E_SECRETS_AVAILABLE" != "true" ]; then
            echo "E2E NOT RUN / ENVIRONMENT UNAVAILABLE" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::E2E NOT RUN / ENVIRONMENT UNAVAILABLE: Supabase E2E secrets are not configured."
            exit 1
          fi

          if [ "$PLAYWRIGHT_OUTCOME" = "success" ]; then
            echo "E2E PASSED" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "E2E FAILED (Playwright outcome: $PLAYWRIGHT_OUTCOME)" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::E2E FAILED (Playwright outcome: $PLAYWRIGHT_OUTCOME)."
          exit 1
