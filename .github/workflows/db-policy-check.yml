name: DB RLS policy regression check

on:
  pull_request:
    paths:
      - 'backend/supabase/**'
      - 'sql/**'
      - '.github/workflows/db-policy-check.yml'

jobs:
  db-policy-check:
    if: ${{ secrets.STAGING_DATABASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Check RLS coverage and permissive policies
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -f sql/rules_coverage_check.sql | tee rls-findings.txt
          if [ -s rls-findings.txt ]; then
            echo "RLS policy regression detected:"
            cat rls-findings.txt
            exit 1
          fi
          echo "RLS policy regression check passed."
