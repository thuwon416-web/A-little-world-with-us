version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
      major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
  
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-native"
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-native"
        update-types:
          - "minor"
          - "patch"
      major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
