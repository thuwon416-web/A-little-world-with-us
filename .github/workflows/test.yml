name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep only the newest run for the same branch/PR to avoid stale queued work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: ./apps/web
        run: npm ci --ignore-scripts
      - name: Run web lint
        working-directory: ./apps/web
        run: npm run lint
      - name: Run web TypeScript check
        working-directory: ./apps/web
        run: npm run typecheck
      - name: Run web tests with coverage (Vitest)
        working-directory: ./apps/web
        run: npm run test:coverage
      - name: Run web A11Y tests
        working-directory: ./apps/web
        run: ./node_modules/.bin/vitest run src/tests/a11y.test.tsx
      - name: Build web production bundle
        working-directory: ./apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: ./apps/mobile
        run: npm ci --include=dev --ignore-scripts
      - name: Run mobile TypeScript check
        working-directory: ./apps/mobile
        run: npm run typecheck
      - name: Run mobile lint
        working-directory: ./apps/mobile
        run: npm run lint
      - name: Run mobile tests with coverage (Jest)
        working-directory: ./apps/mobile
        run: npm run test:coverage
      - name: Upload mobile coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/
          retention-days: 7
