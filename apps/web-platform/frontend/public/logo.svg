<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Space & Heart Gradients -->
    <radialGradient id="lwCosmicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b154c" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#190a24" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#090310" stop-opacity="1" />
    </radialGradient>

    <!-- Partner A: Rose Pink Heart Gradient -->
    <linearGradient id="heartPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Partner B: Warm Sunset Gold & Violet Gradient -->
    <linearGradient id="heartSunsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Planetary Ribbon Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0" />
      <stop offset="30%" stop-color="#f43f5e" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#fb7185" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="1" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= CELESTIAL BACKGROUND ORB ================= -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="rgba(244, 63, 94, 0.22)" stroke-width="2" stroke-dasharray="4 8" />
  <circle cx="250" cy="250" r="195" fill="url(#lwCosmicGlow)" stroke="rgba(244, 63, 94, 0.45)" stroke-width="2.5" />

  <!-- Constellation Stars -->
  <circle cx="150" cy="170" r="2.8" fill="#fde047" opacity="0.85" />
  <circle cx="350" cy="160" r="2.8" fill="#fde047" opacity="0.9" />
  <circle cx="370" cy="290" r="2.2" fill="#fda4af" opacity="0.8" />
  <circle cx="130" cy="300" r="2.2" fill="#fda4af" opacity="0.8" />
  <circle cx="250" cy="110" r="3.2" fill="#ffffff" opacity="0.95" />
  <circle cx="200" cy="360" r="2" fill="#fde047" opacity="0.75" />
  <circle cx="300" cy="370" r="2" fill="#fda4af" opacity="0.75" />

  <!-- Orbiting Star Cross (Spark of Togetherness) -->
  <path d="M 250 102 L 250 118 M 242 110 L 258 110" stroke="#fde047" stroke-width="2" stroke-linecap="round" />

  <!-- ================= PLANETARY COZY ORBIT RING ================= -->
  <ellipse cx="250" cy="255" rx="210" ry="80" 
           fill="none" 
           stroke="url(#orbitGrad)" 
           stroke-width="5.5" 
           transform="rotate(-20 250 255)" 
           stroke-linecap="round" />

  <!-- Small Satellite Love Bead on Orbit -->
  <circle cx="415" cy="200" r="6" fill="#fde047" filter="url(#heartGlow)" />
  <circle cx="85" cy="310" r="4.5" fill="#f43f5e" filter="url(#heartGlow)" />

  <!-- ================= INTERTWINED HEARTS (COUPLE EMBRACE) ================= -->
  <g transform="translate(0, 40)">
    <!-- Left Heart (She/Partner A) -->
    <g filter="url(#heartGlow)">
      <path d="M 215 140 
               C 175 110, 130 145, 145 195 
               C 160 245, 230 285, 240 295 
               C 230 255, 195 210, 205 175 
               C 210 160, 220 150, 230 145 Z" 
            fill="url(#heartPinkGrad)" 
            opacity="0.95" />
    </g>

    <!-- Right Heart (He/Partner B - Interlocking Infinity) -->
    <g filter="url(#heartGlow)">
      <path d="M 285 140 
               C 325 110, 370 145, 355 195 
               C 340 245, 270 285, 260 295 
               C 270 255, 305 210, 295 175 
               C 290 160, 280 150, 270 145 Z" 
            fill="url(#heartSunsetGrad)" 
            opacity="0.92" />
    </g>

    <!-- Center Heart Fusion Peak (Infinity Knot of Love) -->
    <path d="M 250 165 C 235 140, 205 155, 220 185 C 230 205, 250 230, 250 230 C 250 230, 270 205, 280 185 C 295 155, 265 140, 250 165 Z" 
          fill="#f43f5e" 
          opacity="0.9" />

    <!-- Delicate Golden Heart Core Reflection -->
    <circle cx="250" cy="200" r="8" fill="#fde047" opacity="0.95" filter="url(#heartGlow)" />
  </g>
</svg>
